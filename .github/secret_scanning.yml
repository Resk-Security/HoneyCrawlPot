# .github/secret_scanning.yml
# This repository is a honeypot library: every "credential" shipped in src/
# and test/ is a deliberately fabricated decoy file (fake AWS/Stripe keys,
# fake JWT secrets, dummy PEM private keys, ...) that resembles a real
# secret on purpose — that is the entire point of the decoys.
# Exclude these paths from secret scanning (alerts AND push protection).
paths-ignore:
  - "src/**"
  - "test/**"
