name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun test
      - run: bun run build
      - name: Node ESM smoke test
        run: |
          node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof m.handleProbe !== 'function') throw new Error('handleProbe export missing'); })"
      - name: Dependency audit
        run: bun audit --audit-level=high
